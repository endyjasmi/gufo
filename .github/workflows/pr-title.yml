name: PR title

on:
  # TEMP(#775): PR runs paused while the Windows build is brought up step
  # by step in windows-bringup.yml; revert this commit to restore them.
  # pull_request:
  #   branches: [ main ]
  #   types: [ opened, edited, reopened, synchronize ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/ci/check-pr-title.py "$PR_TITLE"
